<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>我的物品 · 日均成本台账</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- ================= 资产 ================= -->
  <section class="view" id="view-assets">
    <header class="topbar">
      <div class="states scroll-x" id="state-tabs"></div>
      <span class="sync-dot" id="sync-dot" title="同步状态"></span>
      <button class="icon-btn" id="btn-more" title="更多">⚙</button>
    </header>

    <div class="hero">
      <div class="hero-blob"></div>
      <div class="hero-top">
        <span class="hero-title" id="hero-title">全部物品</span>
        <button class="hero-search" id="btn-search" title="搜索">🔍</button>
        <span class="hero-grow"></span>
        <select class="hero-sort" id="sort-select">
          <option value="date">默认</option>
          <option value="daily">按日均</option>
          <option value="price">按价格</option>
          <option value="days">按天数</option>
        </select>
      </div>
      <div class="hero-stats">
        <div class="hs">
          <div class="hs-v" id="sum-total">0.00</div>
          <div class="hs-k">资产总计(¥)</div>
        </div>
        <div class="hs">
          <div class="hs-v" id="sum-daily">0.00</div>
          <div class="hs-k">总日均(¥)</div>
        </div>
        <div class="hs">
          <div class="hs-v" id="sum-count">0</div>
          <div class="hs-k">数量(个)</div>
        </div>
      </div>
    </div>

    <div class="chips scroll-x" id="cat-chips"></div>

    <div class="searchbox hidden" id="searchbox">
      <input id="q" type="search" placeholder="搜索名称、备注…" autocomplete="off">
      <button id="btn-q-clear">取消</button>
    </div>

    <div id="asset-list" class="list"></div>

    <div class="empty hidden" id="asset-empty">
      <div class="empty-ico">📦</div>
      <p>还没有记录</p>
      <span>点下面的「新增」，把第一件东西记下来</span>
    </div>

    <div class="dock">
      <button class="btn-main" id="btn-new">新增</button>
    </div>
  </section>

  <!-- ================= 装备库 ================= -->
  <section class="view hidden" id="view-gear">
    <header class="pagehead">
      <div class="kicker">GEAR LIBRARY</div>
      <h1>装备库</h1>
      <p class="sub">看参数、比参考价，一键加入我的资产。</p>
      <div class="searchbar">
        <span>🔍</span>
        <input id="gq" type="search" placeholder="搜索装备、品牌、面料" autocomplete="off">
      </div>
    </header>
    <div class="chips scroll-x" id="gear-chips"></div>
    <div class="grid" id="gear-grid"></div>
    <div class="empty hidden" id="gear-empty">
      <div class="empty-ico">🔍</div>
      <p>没有匹配的装备</p>
    </div>
    <div class="note">示例数据，可自行增删</div>
  </section>

  <!-- ================= 分析 ================= -->
  <section class="view hidden" id="view-stats">
    <header class="pagehead">
      <div class="kicker">COST ANALYSIS</div>
      <h1>成本分析</h1>
    </header>
    <div id="stats-body" class="list"></div>
  </section>

  <!-- ================= 底部导航 ================= -->
  <nav class="tabbar">
    <button class="tab on" data-tab="assets">
      <svg viewBox="0 0 24 24"><path d="M4 8h16v11H4z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span>资产</span>
    </button>
    <button class="tab" data-tab="gear">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      <span>装备库</span>
    </button>
    <button class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24"><path d="M5 19V9M12 19V5M19 19v-7"/></svg>
      <span>分析</span>
    </button>
  </nav>
</div>

<!-- ================= 详情 ================= -->
<div class="sheet" id="detail-sheet">
  <div class="sheet-panel">
    <div class="sheet-head">
      <button class="icon-btn" data-close>‹</button>
      <strong>详情</strong>
      <button class="text-btn danger" id="btn-del">删除</button>
    </div>
    <div class="sheet-scroll" id="detail-body"></div>
    <div class="dock">
      <button class="btn-main" id="btn-edit">编辑</button>
    </div>
  </div>
</div>

<!-- ================= 装备详情 ================= -->
<div class="sheet" id="gsheet">
  <div class="sheet-panel">
    <div class="sheet-head">
      <button class="icon-btn" data-close>‹</button>
      <strong>装备详情</strong>
      <span style="width:44px"></span>
    </div>
    <div class="sheet-scroll" id="gdetail-body"></div>
    <div class="dock" id="gdetail-actions"></div>
  </div>
</div>

<!-- ================= 新增/编辑 ================= -->
<div class="sheet" id="editor-sheet">
  <div class="sheet-panel">
    <div class="sheet-head">
      <button class="icon-btn" data-close>‹</button>
      <strong id="editor-title">新增</strong>
      <span style="width:44px"></span>
    </div>
    <form class="sheet-scroll" id="editor-form" autocomplete="off">
      <div class="form-section">基本信息</div>
      <div class="form-card">
        <label class="row"><span>名称</span><input name="name" required placeholder="输入名称"></label>
        <label class="row"><span>购买时间</span><input type="date" name="purchaseDate" required></label>
      </div>

      <div class="form-section">以下为选填项</div>

      <div class="form-card">
        <div class="row" id="icon-row">
          <span>物品图标</span>
          <button type="button" class="icon-preview" id="icon-preview">📦 <small>选择</small></button>
        </div>
        <div class="icon-picker hidden" id="icon-picker"></div>

        <label class="row"><span>价格</span><input type="number" name="price" step="0.01" min="0" placeholder="输入价格" inputmode="decimal"></label>
        <label class="row"><span>数量</span><input type="number" name="qty" step="1" min="1" value="1" inputmode="numeric"></label>
        <label class="row"><span>附加费用</span><input type="number" name="extra" step="0.01" min="0" placeholder="运费、配件等" inputmode="decimal"></label>

        <div class="row">
          <span>计划用多久</span>
          <span class="inline-input">
            <input type="number" name="lifeValue" step="1" min="0" placeholder="输入数字" inputmode="numeric">
            <select name="lifeUnit"><option>年</option><option>月</option><option>天</option></select>
          </span>
        </div>

        <label class="row"><span>设置有效期</span><input type="checkbox" name="hasExpiry" class="switch"></label>

        <label class="row"><span>分类</span>
          <select name="cat" id="editor-cat"></select>
        </label>

        <label class="row"><span>使用状态</span>
          <select name="status">
            <option>服役中</option><option>预备役</option><option>已退役</option>
          </select>
        </label>

        <label class="row"><span>减去二手价值</span><input type="checkbox" name="subtractResale" class="switch"></label>
        <label class="row"><span>二手价值</span><input type="number" name="resale" step="0.01" min="0" placeholder="未填写" inputmode="decimal"></label>

        <label class="row"><span>计算单次使用</span><input type="checkbox" name="trackPerUse" class="switch"></label>
        <label class="row"><span>已使用次数</span><input type="number" name="baseCount" step="1" min="0" value="0" placeholder="0" inputmode="numeric"></label>
      </div>

      <div class="form-card">
        <label class="row col"><span>备注</span><textarea name="notes" rows="2" placeholder="尺码、磨损、保养…"></textarea></label>
      </div>

      <div class="dock">
        <button type="submit" class="btn-main">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- ================= 登录 ================= -->
<div class="sheet" id="login-sheet">
  <div class="sheet-panel sheet-auto">
    <div class="login-wrap">
      <div class="login-logo">🎒</div>
      <h2>登录</h2>
      <p class="login-sub">数据同步到你的账号<br>换手机、换电脑都能看到同一份</p>
      <input id="login-email" type="email" placeholder="邮箱" autocomplete="username" inputmode="email">
      <input id="login-pwd" type="password" placeholder="密码" autocomplete="current-password">
      <button class="btn-main" id="login-btn">登录</button>
      <div class="login-err" id="login-err"></div>
      <p class="login-tip">没有账号？联系管理员开通</p>
      <button class="link-btn" id="login-skip">先离线使用，登录后自动同步</button>
    </div>
  </div>
</div>

<!-- ================= 通用图标选择 ================= -->
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="cloud.js"></script>
<script src="app.js"></script>
</body>
</html>
